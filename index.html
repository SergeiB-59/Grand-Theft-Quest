<body>
<main>
<h1>Grand Theft Quest</h1>
<p class="sub">Retracez l'histoire de GTA et ouvrez le coffre.</p>
<div id="top" class="hidden"><div class="bar"><span class="brand">Grand Theft Quest</span><span><span class="timer" id="timer"></span><button class="mute" id="mt" aria-label="Couper ou remettre la musique">♪ On</button></span></div><ol class="frise" id="fr" aria-label="Progression des missions"></ol></div>
<section class="card" id="card"></section>
</main>

<script>
/* ===== À PERSONNALISER ===== */
var VAULT_CODE="GTA6"; /* code du cadenas final (provisoire) */
var NOREC=["Alexis.L","Florian.R","Benjamin.D","Noah.M","Roman.F","Gwenael.B","Dylan.M","Hugo.K","Cédric.L","Mélidie.D","Danaé.T","Mustapha.B","Julien.P","Jerome.DM","Victoria.M","Damien.N"]; /* agents « à ne pas recruter » affichés en bas du tableau de Lester */
var VKEY="LEONIDA"; /* clé de Vigénère révélée dans la cinématique de fin de GTA V */
var M=[
 {n:"Grand Theft Auto",s:"GTA",st:["énigme"]},
 {n:"Grand Theft Auto: London, 1969",s:"London 69",st:["énigme"]},
 {n:"Grand Theft Auto: London, 1961",s:"London 61",st:["énigme"]},
 {n:"Grand Theft Auto 2",s:"GTA 2",st:["énigme"]},
 {n:"Grand Theft Auto III",s:"GTA III",st:["énigme","énigme","blind test"]},
 {n:"Grand Theft Auto: Vice City",s:"Vice City",st:["blind test","énigme"]},
 {n:"Grand Theft Auto: San Andreas",s:"San Andreas",st:["blind test","énigme"]},
 {n:"Grand Theft Auto: Vice City Stories",s:"VC Stories",st:["blind test"]},
 {n:"Grand Theft Auto IV",s:"GTA IV",st:["blind test","énigme","énigme","énigme","énigme"]},
 {n:"Grand Theft Auto: Chinatown Wars",s:"Chinatown",st:["mini-jeu","mini-jeu"]},
 {n:"Grand Theft Auto V",s:"GTA V",st:["mini-jeu","mini-jeu","mini-jeu","mini-jeu","mini-jeu"]},
 {n:"Grand Theft Auto VI",s:"GTA VI",st:["énigme finale"]}
];
/* Musique de fond de chaque mission : nom exact du fichier MP3 déposé à côté de index.html ("" = silence).
   Attention : GitHub distingue majuscules et minuscules. */
var MU=[
 "GTA 1 Theme Song.mp3",
 "GTA 1 Theme Song.mp3",
 "GTA 1 Theme Song.mp3",
 "Grand Theft Auto 2 - Main Theme.mp3",
 "Grand Theft Auto 3 \u2014 Theme Song.mp3",
 "Gta Vice City Theme.mp3",
 "Grand Theft Auto San Andreas (Official Theme Song).mp3",
 "Grand Theft Auto Vice City Stories Theme Song.mp3",
 "Grand Theft Auto IV Theme Song _[best quality]_.mp3",
 "",
 "GTA V - Welcome to Los Santos Soundtrack - IntroTheme song.mp3",
 "GTA 6 - Official Main Theme Music.mp3"
];
M.forEach(function(m,i){if(MU[i])m.mu=MU[i]});
/* Contenu provisoire de chaque épreuve : q = question, a = réponses acceptées, hint = indice */
function ph(t){return{t:t,q:"Contenu à définir. Pour tester, tapez « ok ».",a:["ok"],hint:"Indice à définir."}}
M.forEach(function(m){m.st=m.st.map(ph)});
/* Mission 1 : GTA (1997) */
M[0].st[0].q="Dans le tout premier GTA (1997), combien de villes peut-on explorer ?";
M[0].st[0].a=["3","trois"];
M[0].st[0].hint="Consultez la page du jeu.";
M[0].st[0].link="https://www.imdb.com/fr/title/tt0248048/?ref_=ext_shr_lnk";
M[0].st[0].show="3 (Liberty City, San Andreas, Vice City)";
M[0].st[0].info="Les trois villes du tout premier GTA sont <strong>Liberty City</strong> (inspirée de New York), <strong>San Andreas</strong> (inspirée de San Francisco) et <strong>Vice City</strong> (inspirée de Miami).";
/* Mission 2 : London 1969 */
M[1].st[0].show="Dan Houser";
M[1].st[0].info="Né à Londres, <strong>Dan Houser</strong> signe seul l'écriture de cette extension : c'est le début de sa carrière de scénariste chez Rockstar. Il y glisse l'ambiance du Swinging London, de l'argot cockney et des clins d'œil aux frères Kray, célèbres figures du crime londonien. Ce goût du détail de culture populaire deviendra la marque de fabrique de toute la saga.";
/* Mission 3 : London 1961 */
M[2].st[0].q="Pour qui travaille-t-on dans cette seconde extension du premier opus ?";
M[2].st[0].a=["haroldcartwright","cartwright"];
M[2].st[0].show="Harold Cartwright";
M[2].st[0].hint="Consultez la page du jeu.";
M[2].st[0].link="https://www.imdb.com/fr/title/tt3205178/?ref_=ls_t_3";
M[2].st[0].info="Londres, 1961 : <strong>Harold Cartwright</strong>, un caïd du crime qui prétend ne craindre personne, engage un jeune truand pour toutes sortes de sales boulots, que ce soit pour les redoutables jumeaux Crisp ou pour son propre gang. À la fin, il le félicite en personne dans un bar. Mais huit ans plus tard, dans London 1969, la roue tourne : ce sont les jumeaux Crisp qui ordonnent d'éliminer Harold. Cette extension, sortie gratuitement en juillet 1999, met en scène les mêmes personnages, en plus jeunes.";
/* Mission 4 : GTA 2 */
M[3].st[0].q="Dans GTA 2, quel est le nom du bâtiment où l'on doit aller pour sauvegarder sa partie ?";
M[3].st[0].a=["jesussave","jesussaves","jesus","eglisejesussaves","leglisejesussaves"];
M[3].st[0].show="Jesus Saves (l'église)";
M[3].st[0].hint="Regardez cette vidéo.";
M[3].st[0].lt="Ouvrir la vidéo";
M[3].st[0].link="https://www.youtube.com/watch?v=DRc8vJRUrRo&t=93s";
M[3].st[0].info="Dans GTA 2, il n'y a pas de bouton de sauvegarde : il faut trouver l'église <strong>Jesus Saves</strong> et y entrer, ce qui coûte de l'argent, donc mieux vaut avoir réussi quelques missions avant. Au fait, le héros s'appelle <strong>Claude Speed</strong> : ne le confondez pas avec Claude, le héros muet de GTA III.";
/* Mission 5 : GTA III (2 questions) */
M[4].st[0].q="Quel célèbre quartier, présent dans le 3ème opus, est le repaire de la mafia chinoise appelée la Triade ?";
M[4].st[0].a=["chinatown","quartierchinois","lequartierchinois"];
M[4].st[0].show="Chinatown";
M[4].st[0].info="<strong>Chinatown</strong>, sur l'île de Portland à Liberty City, est le territoire de la Triade. Son conflit avec la famille mafieuse Leone ouvre le premier acte de l'histoire de GTA III. Retenez ce quartier : la Triade reviendra au cœur de l'intrigue de Chinatown Wars, plus loin dans votre parcours.";
M[4].st[1].q="Dans GTA III, quel membre de la famille Leone ordonne à Claude d'éliminer les trois chefs de la Triade ?";
M[4].st[1].a=["tonicipriani","toni","cipriani"];
M[4].st[1].show="Toni Cipriani";
M[4].st[1].info="<strong>Toni Cipriani</strong>, capo de la famille Leone, donne la mission « Triads and Tribulations » depuis le restaurant de sa mère, à Saint Mark's, le quartier italien de Portland. Claude doit y emmener deux mafieux Leone à Chinatown pour éliminer trois chefs de la Triade. Toni deviendra plus tard le héros de Liberty City Stories, un préquel situé en 1998.";
M[4].st[2].q="Blind test : quel est le titre de ce morceau, que l'on entend à la radio dans GTA III ?";
M[4].st[2].a=["pushittothelimit","pushittolimit","pushtothelimit","scarfacepushittothelimit"];
M[4].st[2].show="Push It to the Limit (Paul Engemann)";
M[4].st[2].hint="Ce morceau est aussi présent dans le film Scarface.";
M[4].st[2].info="« Scarface (Push It to the Limit) », composé par Giorgio Moroder et chanté par <strong>Paul Engemann</strong>, vient de la bande originale du film Scarface (1983). Dans GTA III, on l'entend sur Flashback 95.6, la station des années 80. Vous le retrouverez aussi dans Vice City, dont l'ambiance doit beaucoup à ce film.";
/* Mission 6 : Vice City */
M[5].st[0].q="Blind test : quel groupe joue ce morceau, présent dans le jeu GTA Vice City ?";
M[5].st[0].a=["toto"];
M[5].st[0].show="Toto (Africa)";
M[5].st[0].hint="0 + 0 = ?";
M[5].st[0].info="C'est <strong>Toto</strong>, avec « Africa » (1982). Ce morceau passe sur la radio Emotion 98.3 dans Vice City, et on l'entend aussi pendant la cinématique qui suit l'achat de l'usine de glaces Cherry Popper. Un morceau devenu culte bien au-delà du jeu.";
M[5].st[1].q="Quelle est la célèbre voiture de cet opus, inspirée de la Ferrari Testarossa ?";
M[5].st[1].a=["cheetah","lacheetah","grotticheetah"];
M[5].st[1].show="La Cheetah";
M[5].st[1].info="C'est la <strong>Cheetah</strong>, inspirée de la <strong>Ferrari Testarossa</strong>, icône des années 80, la décennie de Vice City et de la série Miami Vice. Elle fait partie des voitures les plus rapides du jeu, et la police de Vice City en utilise même une version banalisée.";
/* Mission 7 : San Andreas */
M[6].st[0].q="Blind test : quel est le titre de ce morceau, que l'on entend dans GTA San Andreas ?";
M[6].st[0].a=["ahorsewithnoname","horsewithnoname","unchevalsansnom","chevalsansnom","caballosinnombre"];
M[6].st[0].show="A Horse with No Name (America)";
M[6].st[0].hint="Walter White chante aussi ce morceau dans Breaking Bad.";
M[6].st[0].vid="san-andreas.mp4";
M[6].st[0].gif="walter-white.gif";
M[6].st[0].alt2="Walter White chante le morceau dans Breaking Bad";
M[6].st[0].info="C'est <strong>« A Horse with No Name »</strong> du groupe America (1972), diffusé sur K-DST, la radio rock de San Andreas, idéale pour rouler dans le désert. Walter White le chante lui aussi dans Breaking Bad, dans la saison 3, épisode « Caballo sin Nombre », juste avant de se faire arrêter par la police.";
M[6].st[1].q="Quel code de triche de San Andreas donne d'un coup la vie, l'armure et de l'argent au joueur ?";
M[6].st[1].a=["hesoyam"];

  $("wg").innerHTML='<div class="mapw"><div class="pinw" id="pw"><img id="pi" src="'+encodeURIComponent(p.mapimg)+'" alt="Plan de Liberty City" draggable="false" onerror="this.outerHTML=\'<div class=box>Carte à venir</div>\'"></div><p class="cap">Touchez la carte pour placer votre repère, puis validez.</p></div>';
  var pt=null,pw=$("pw");
  pw.onclick=function(e){var im=$("pi");if(!im||!im.getBoundingClientRect)return;var r=im.getBoundingClientRect();if(!r.width)return;var x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;pt={x:x,y:y};var d=pw.querySelector(".dot");if(!d){d=document.createElement("div");d.className="dot";pw.appendChild(d)}d.style.left=x+"%";d.style.top=y+"%";beep(520,.06)};
  return {ok:function(){return !!pt&&Math.sqrt(Math.pow(pt.x-p.tx,2)+Math.pow(pt.y-p.ty,2))<=p.tol}}
 },
 map:function(p){
  var R=[["alderney","28,70 105,52 112,140 98,215 118,285 60,300 25,230 38,150"],["algonquin","150,35 205,28 218,120 212,215 232,262 190,282 160,240 152,140"],["bohan","245,38 335,30 342,105 262,118"],["dukes","262,128 340,116 335,200 292,232 258,206"],["broker","242,238 292,244 338,214 330,300 300,335 235,325 215,285"]],sel="";
  $("wg").innerHTML='<div class="mapw"><svg viewBox="0 0 370 350" role="group" aria-label="Plan schématique de Liberty City">'+R.map(function(r,i){return '<polygon class="reg" data-id="'+r[0]+'" points="'+r[1]+'" tabindex="0" role="button" aria-label="Zone '+(i+1)+'"></polygon>'}).join("")+'<text x="345" y="338" fill="#ffd9a0" font-size="14" font-family="Arial" text-anchor="middle">N ↑</text></svg><p class="cap">Plan schématique de Liberty City (nord en haut). Touchez une zone pour la sélectionner.</p></div>';
  var regs=document.querySelectorAll(".reg");
  function pick(el){sel=el.getAttribute("data-id");Array.prototype.forEach.call(regs,function(x){x.classList.toggle("sel",x===el)});beep(520,.06)}
  Array.prototype.forEach.call(regs,function(el){el.onclick=function(){pick(el)};el.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(el)}}});
  return {ok:function(){return sel===p.target}}
 }
};
function mission(){
 begin();draw();radioStop();stopSnd();var m=M[S.m],n=m.st.length,p=m.st[S.s],audio=p.t==="blind test";var mu=p.mu||m.mu;want=!!mu&&!audio&&p.kind!=="radio"&&p.kind!=="heist";bgPlay(mu,want);
 var key=S.m+"-"+S.s;S.hs=S.hs||{};var hs=hints(p),shown=S.hs[key]||0;
 var media=audio?(p.aud?`<audio class="aud" controls preload="auto" src="${encodeURIComponent(p.aud)}" onerror="this.outerHTML='<div class=box>Extrait à venir</div>'"></audio>`:'<div class="box">Extrait à venir</div>'):"";
 card.innerHTML=`<p class="era">Mission ${S.m+1} sur 12</p><h2>${m.n}</h2><p class="obj">Objectif : ${m.obj||("réussir "+n+" épreuve"+(n>1?"s":"")+" ("+m.st.map(function(x){return lab(x.t)}).join(", ")+").")}</p><hr><p class="era"><span class="badge">${TY[p.t]}</span> ${p.lbl||("Étape "+(S.s+1)+" sur "+n)}</p>${p.cover?pic(p.cover,"cover",1):""}<p class="q">${p.q}</p>${p.img?pic(p.img):""}${media}${p.kind?'<div id="wg"></div>':""}<input id="ans" type="text" autocomplete="off" aria-label="Votre réponse" placeholder="Votre réponse"><div class="row"><button id="go">Valider</button><button class="ghost" id="hb">Un indice</button></div><div id="hl"></div><p class="msg" id="msg" role="status"></p>`;
 var ans=$("ans"),msg=$("msg"),hb=$("hb"),hl=$("hl");var Wd=p.kind?WG[p.kind](p):null;if(p.kind)ans.style.display="none";
 function lbl(){hb.textContent=shown===0?"Un indice":shown>=hs.length?"Plus d'indice":shown===hs.length-1?"Dernier indice":"Indice suivant";hb.disabled=shown>=hs.length}
 for(var i=0;i<shown;i++)hl.innerHTML+=hintHTML(hs[i]);lbl();if(!hs.length)hb.style.display="none";
 hb.onclick=function(){if(shown>=hs.length)return;hl.innerHTML+=hintHTML(hs[shown]);shown++;S.hs[key]=shown;S.hints=(S.hints||0)+1;sv();lbl()};
 function check(){
  if(p.kind?!Wd.ok():p.a.indexOf(norm(ans.value))<0){S.wrong=(S.wrong||0)+1;sv();bad(msg,"Raté, réessayez.",true);return}
  ok()
 }
 function ok(){
  S.lm=S.m;S.ls=S.s;
  if(S.s<n-1)S.s++;else{S.m++;S.s=0;want=false;bgPlay(0,false);if(S.m===12)S.end=Date.now()}
  S.pass=true;sv();if(p.kind==="radio"){if(RAD.s){try{RAD.s.s.stop()}catch(e){}RAD.s=null}(RAD.all||[]).forEach(function(x){if(!x.good&&x.a)x.a.pause()})}else if(!p.noPass)playPass();passScr()
 }
 $("go").onclick=check;ans.onkeydown=function(e){if(e.key==="Enter")check()};adminBtn($("go").parentNode,"Passer (admin)",ok);if(!p.kind)ans.focus()
}
function passScr(){
 begin();draw();var p=M[S.lm].st[S.ls],k=S.lm,changed=S.m>S.lm;
 card.innerHTML=`<div class="pass"><p class="gold">Mission réussie</p></div>${infoHTML(p)}<button class="go" id="nx">Mission suivante</button>`;
 $("nx").onclick=function(){stopSnd();fadeXA(3500);S.pass=false;sv();if(S.end){padlock();return}if(changed&&TRANS[k])transition(k,mission);else mission()}
}
function transition(k,done){
 begin();draw();var t=TRANS[k];jingle([392,523,659,784]);
 card.innerHTML=`<div class="pass"><p class="era">Chapitre terminé</p><p class="gold">${t[0]}, c'est terminé !</p><p class="q">Direction <strong>${t[1]}</strong>…</p><div class="tbar"><i></i></div></div>`;
 setTimeout(done,4300)
}
function padlock(){
 begin();draw();
 card.innerHTML=`<p class="era">Dernière étape</p><h2>Le cadenas du coffre</h2><p class="q">Saisissez la clé que vous avez débloquée pour ouvrir le coffre-fort.</p><div class="lock" id="lk"><div class="shackle"></div><div class="lbody"><input id="code" type="text" maxlength="16" autocomplete="off" aria-label="Code du cadenas" placeholder="••••"></div></div><div class="row" style="justify-content:center"><button id="op">Ouvrir</button></div><p class="msg" id="msg" role="status"></p>`;
 var c=$("code");
 function go(){
  if(norm(c.value)!==norm(VAULT_CODE)){bad($("msg"),"Le cadenas ne s'ouvre pas.");return}
  $("lk").classList.add("open");jingle([392,523,659]);S.open=true;sv();setTimeout(vault,1300)
 }
 adminBtn($("op").parentNode,"Ouvrir (admin)",function(){$("lk").classList.add("open");jingle([392,523,659]);S.open=true;sv();setTimeout(vault,1300)});
 $("op").onclick=go;c.onkeydown=function(e){if(e.key==="Enter")go()};c.focus()
}
function vault(fast){
 var f=fast===true;begin();draw();
 card.innerHTML=`<div class="win"><p class="era">Cadenas déverrouillé</p><h2>Le coffre s'ouvre...</h2><div class="safe${f?" open":""}" id="safe"><div class="inside">Coffre ouvert</div><div class="door"><div class="dial"></div></div></div><div class="${f?"":"hidden"}" id="end"><h2>Félicitations !</h2><p>Tu as réussi à passer toutes les missions, <strong>${esc(S.name)}</strong>.</p><p>Temps final : <strong>${fmt(S.end-S.start)}</strong><br>Mauvaises réponses : <strong>${S.wrong||0}</strong><br>Indices utilisés : <strong>${S.hints||0}</strong><br>Sorties d'onglet : <strong>${S.tabs||0}</strong></p><p>Envoie vite tes résultats à ton superviseur pour découvrir si tu es l'heureux vainqueur.</p><div class="row" style="justify-content:center"><button class="ghost" id="rv">Revoir mes réponses et anecdotes</button></div></div></div>`;
 $("rv").onclick=review;
 if(f)return;
 setTimeout(function(){$("safe").classList.add("open");jingle([392,523,659,784,1047])},600);
 setTimeout(function(){$("end").classList.remove("hidden")},3400)
}
function review(){
 begin();draw();
 var h=M.map(function(m,i){var it=m.st.filter(function(p){return p.info||p.show}).map(function(p){return '<div class="rv"><p class="q">'+p.q+'</p><p class="ra">Réponse : <strong>'+esc(p.show||p.a[0])+'</strong></p>'+infoHTML(p)+"</div>"}).join("");return it?"<h3>Mission "+(i+1)+" : "+m.n+"</h3>"+it:""}).join("");
 card.innerHTML='<p class="era">Dossier de mission</p><h2>Vos réponses et anecdotes</h2>'+h+'<div class="row"><button id="bk">Retour à mon score final</button></div>';
 $("bk").onclick=function(){vault(true)};window.scrollTo(0,0)
}
/* démarrage */
document.addEventListener("visibilitychange",function(){if(document.hidden&&S.start&&!S.end){S.tabs=(S.tabs||0)+1;sv()}});
$("mt").onclick=function(){S.mute=!S.mute;sv();mlabel();(RAD.all||[]).forEach(function(x){if(x.a)x.a.muted=!!S.mute});if(RAD.s){try{RAD.s.g.gain.cancelScheduledValues(0);RAD.s.g.gain.value=S.mute?0:.03}catch(e){}}if(S.mute){stopSnd();XA.forEach(function(x){try{x.pause()}catch(e){}});var _a=document.querySelectorAll("audio");Array.prototype.forEach.call(_a,function(x){x.pause()})}if(S.mute){if(bg)bg.pause()}else if(want&&bg){var p=bg.play();if(p&&p.catch)p.catch(function(){})}};mlabel();
if(location.hash==="#reset-orga"){try{localStorage.removeItem(KEY)}catch(e){}S={};history.replaceState(null,"",location.pathname)}
if(S.open)vault();else if(S.end&&!S.pass)padlock();else if(S.start)S.pass?passScr():mission();else if(S.rules)prologue();else if(S.name)brief();else nameScr();
</script>
