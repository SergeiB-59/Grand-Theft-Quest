<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Theft Quest : le casse de l'équipe</title>
<style>
:root{--bg:#1a0b2e;--bg2:#2d0f45;--pink:#ff2e88;--cyan:#19e3d6;--sand:#ffd9a0;--ink:#fff6ea;--card:#25103c;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 60%,#5a1747 100%) fixed;color:var(--ink);font:17px/1.55 Georgia,'Times New Roman',serif;min-height:100vh}
main{max-width:660px;margin:0 auto;padding:28px 18px 60px}
h1{font:italic 900 clamp(2.4rem,9vw,4rem)/.95 Impact,'Arial Black',sans-serif;margin:8px 0 6px;color:var(--pink);text-shadow:3px 3px 0 var(--cyan);transform:skew(-6deg)}
.sub{color:var(--sand);margin:0 0 22px}
.play h1,.play .sub{display:none}
#top{position:sticky;top:0;z-index:5;background:#1a0b2ef0;margin:-28px -18px 18px;padding:10px 18px 4px;border-bottom:2px solid #ffffff1a}
.bar{display:flex;justify-content:space-between;align-items:baseline}
.brand{font:italic 900 1.1rem Impact,'Arial Black',sans-serif;color:var(--pink);text-shadow:2px 2px 0 var(--cyan)}
.timer{font:900 1.2rem Impact,'Arial Black',sans-serif;color:var(--cyan)}
.mute{font:700 .8rem Arial,sans-serif;padding:3px 10px;border:2px solid var(--cyan);background:transparent;color:var(--cyan);border-radius:20px;margin-left:10px}
.frise{display:flex;list-style:none;margin:6px 0 0;padding:0 0 8px;overflow-x:auto;position:relative}
.frise li{flex:0 0 74px;text-align:center;position:relative;font:700 .68rem Arial,sans-serif;color:#ffffff88}
.frise li::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:#ffffff22}
.frise li:first-child::before{display:none}
.frise li.done::before,.frise li.now::before{background:var(--cyan)}
.d{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:2px solid #ffffff44;background:var(--bg);position:relative;font-size:.8rem}
.l{display:block;margin-top:2px}
.done .d{background:var(--cyan);border-color:var(--cyan);color:#0d0618}.done{color:var(--cyan)}
.now .d{background:var(--pink);border-color:var(--pink);color:#fff;animation:pl 1.4s infinite}.now{color:var(--ink)}
@keyframes pl{50%{box-shadow:0 0 0 7px #ff2e8844}}
.card{background:var(--card);border:2px solid var(--pink);border-radius:14px;padding:22px;box-shadow:6px 6px 0 var(--cyan)}
.era{color:var(--cyan);font:700 .95rem Arial,sans-serif;margin:0 0 6px}
h2{font:900 1.5rem/1.2 Impact,'Arial Black',sans-serif;margin:0 0 12px;color:var(--sand)}
.obj{color:var(--sand);margin:0 0 10px}
hr{border:0;border-top:1px dashed #ffffff33;margin:14px 0}
.badge{background:var(--pink);color:#fff;border-radius:6px;padding:2px 8px;margin-right:6px}
p{margin:0 0 12px}
a{color:var(--cyan);font-weight:700}
.pic{display:block;max-width:100%;max-height:300px;margin:0 auto 16px;border-radius:10px;border:2px solid var(--cyan)}
.box{background:#0d0618;border:1px dashed var(--cyan);border-radius:8px;padding:12px;margin:0 0 16px;font-family:'Courier New',monospace}
.list{padding-left:22px;margin:0 0 14px;font-size:.95rem}.list small{color:var(--cyan);font-family:Arial,sans-serif}
input{width:100%;font:inherit;padding:12px;border-radius:8px;border:2px solid #ffffff44;background:#0d0618;color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font:700 1rem Arial,sans-serif;padding:12px 20px;border:0;border-radius:8px;cursor:pointer;background:var(--pink);color:#fff}
button.ghost{background:transparent;border:2px solid var(--cyan);color:var(--cyan)}
.msg{min-height:1.6em;margin:12px 0 0;font-family:Arial,sans-serif}
.ok{color:var(--cyan)}.ko{color:var(--pink)}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pass{text-align:center;padding:10px 0}
.gold{font:900 clamp(2rem,9vw,3.2rem)/1 Impact,'Arial Black',sans-serif;color:#f5c542;text-shadow:3px 3px 0 #000,-1px -1px 0 #000;transform:skew(-4deg);margin:0 0 6px;animation:pop .6s}
@keyframes pop{from{transform:scale(.5) skew(-4deg);opacity:0}}
.resp{font:700 1.3rem Arial,sans-serif;color:var(--cyan)}
.lock{width:min(260px,80%);margin:14px auto}
.shackle{width:90px;height:64px;margin:0 auto -6px;border:12px solid #b8bcc6;border-bottom:0;border-radius:45px 45px 0 0;transition:transform .7s;transform-origin:right bottom}
.lock.open .shackle{transform:translateY(-22px) rotate(-18deg)}
.lbody{background:linear-gradient(160deg,#f1c40f,#a77c0a);border-radius:16px;padding:18px;border:3px solid #6b4f00}
.lbody input{text-align:center;letter-spacing:.3em;font:900 1.4rem 'Courier New',monospace;text-transform:uppercase}
.safe{width:min(300px,80vw);aspect-ratio:1;margin:10px auto;position:relative;perspective:900px}
.inside{position:absolute;inset:0;border-radius:12px;background:#0d0618;border:8px solid #555;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;font:900 1.4rem/1.2 Impact,'Arial Black',sans-serif;color:var(--sand)}
.door{position:absolute;inset:0;border-radius:12px;background:linear-gradient(135deg,#8a8f99,#4b4f58);border:8px solid #333;transform-origin:left center;transition:transform 1.8s cubic-bezier(.5,0,.2,1);display:flex;align-items:center;justify-content:center}
.dial{width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#ddd,#777);border:6px solid #222;position:relative;transition:transform 1.4s ease-in-out}
.dial::after{content:"";position:absolute;left:50%;top:6%;width:6%;height:34%;background:var(--pink);transform:translateX(-50%);border-radius:3px}
.safe.open .dial{transform:rotate(720deg)}
.safe.open .door{transform:rotateY(-115deg);transition-delay:1.4s}
.win{text-align:center}.win h2{color:var(--pink);font-size:1.7rem}
.info{margin-top:16px;padding:14px;border:1px dashed var(--cyan);border-radius:8px;background:#0d0618}
.rv{margin:0 0 14px}.rv .q{font-weight:700;margin:0 0 4px}.ra{color:var(--cyan);margin:0 0 6px}
h3{font:700 1.05rem Arial,sans-serif;color:var(--pink);margin:18px 0 8px}
.go{width:100%;background:#1fbf5b;margin-top:16px;font-size:1.25rem;padding:16px}.big{font-size:1.4rem;padding:18px}
button:disabled{opacity:.4;cursor:not-allowed}
.chk{display:block;margin:16px 0;font-family:Arial,sans-serif;cursor:pointer}.chk input{width:22px;height:22px;margin-right:10px;vertical-align:middle;accent-color:#ff2e88}
.warn{color:#ff3b3b;font-weight:700}.hint{margin:10px 0 0;font-family:Arial,sans-serif}.hint+iframe{display:block;margin-top:8px;border-radius:8px}
.aud{width:100%;margin:0 0 16px}.cover{max-height:230px}.rules p{margin:0 0 8px}
.tbar{height:6px;background:#ffffff22;border-radius:3px;margin-top:18px;overflow:hidden}.tbar i{display:block;height:100%;background:var(--cyan);animation:fill 4.2s linear forwards}@keyframes fill{from{width:0}to{width:100%}}
.radio,.phone{max-width:340px;margin:0 auto 16px;padding:16px;border:2px solid var(--cyan);border-radius:14px;background:#0d0618}
.rdisp{font:900 2.6rem 'Courier New',monospace;color:var(--cyan);text-align:center;text-shadow:0 0 14px #19e3d688}.rdisp small{font-size:1rem}
.rscale{position:relative;height:34px;margin:6px 0 12px;border-radius:6px;background:#1a0b2e repeating-linear-gradient(90deg,#ffffff55 0 2px,transparent 2px 20px)}.rscale i{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--pink);box-shadow:0 0 10px var(--pink);border-radius:2px}
.radio input[type=range]{padding:0;border:0;background:transparent;accent-color:#ff2e88}
.radio .row,.phone .row{justify-content:center}
.pdisp{font:900 1.8rem 'Courier New',monospace;color:var(--cyan);text-align:center;min-height:2.4rem;letter-spacing:.12em;margin-bottom:10px}
[hidden]{display:none!important}
.street{position:relative;height:80px;border-radius:10px;background:linear-gradient(#120a1f 62%,#2a2a33 62%);overflow:hidden;margin-bottom:12px}
.street:after{content:"";position:absolute;left:0;right:0;bottom:16px;border-top:3px dashed #ffd9a055}
.taxi{position:absolute;bottom:4px;left:110%;font-size:46px;line-height:1;transition:left 1.6s cubic-bezier(.2,.8,.3,1)}.taxi.come{left:52%}
.meter{height:8px;background:#222;border-radius:4px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;width:0;background:var(--cyan);transition:width .08s}
.hw,.wh{max-width:360px;margin:0 auto 16px;padding:14px;border:2px solid var(--cyan);border-radius:14px;background:#0d0618;text-align:center}
.hwst,.whst{font:700 .85rem Arial,sans-serif;color:#ffd9a0;margin:6px 0 10px;min-height:1.2em}
.hwb{position:relative;width:100%;aspect-ratio:280/180;border-radius:10px;background:#140b1d;overflow:hidden;user-select:none;-webkit-user-select:none}
.pnl{position:absolute;inset:7%;border-radius:8px;background:linear-gradient(135deg,#777a84,#3b3d45);box-shadow:inset 0 0 0 2px #9a9ca4,0 4px 10px #000a;transition:transform .9s ease-in,opacity .9s;z-index:2}
.pnl.off{transform:translateY(150%) rotate(20deg);opacity:0;pointer-events:none}
.pnl b{position:absolute;left:0;right:0;top:44%;font:700 .7rem Arial,sans-serif;color:#2a2b30;letter-spacing:2px}
.scr{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#eee,#7b7d85);box-shadow:0 2px 4px #0009;touch-action:none;cursor:grab;transition:opacity .3s,transform .3s}
.scr i{position:absolute;left:17px;top:5px;width:4px;height:28px;background:#333;border-radius:2px}
.scr.out{opacity:0;transform:scale(1.7);pointer-events:none}
.hwsvg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.ignw{margin-top:12px}.ignw svg{width:200px;max-width:70%;touch-action:none;cursor:grab}.ignw .cap{font-size:.85rem}
.ign{margin-top:12px;width:100%;padding:12px;font:900 1rem Arial,sans-serif;border-radius:10px;border:2px solid #ff2e88;background:#2a0d1c;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.ignbar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin-top:8px}.ignbar i{display:block;height:100%;width:0;background:#ff2e88}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 0;background:#25103c;border:2px solid #ffffff33;font-family:Arial,sans-serif}.key b{font-size:1.5rem}.key small{font-size:.65rem;color:var(--cyan);min-height:.9em;letter-spacing:2px}
.key:active{background:var(--pink)}
.mapw{max-width:420px;margin:0 auto 16px}.mapw svg{width:100%;height:auto;border:2px solid var(--cyan);border-radius:12px;background:#0b1030}
.reg{fill:#3a1a6e;stroke:var(--cyan);stroke-width:2;cursor:pointer;transition:fill .2s}.reg:hover,.reg:focus{fill:#6b1d70;outline:none}.reg.sel{fill:var(--pink)}
.pinw{position:relative;max-width:520px;margin:0 auto;line-height:0;touch-action:manipulation}.pinw img{width:100%;height:auto;border:2px solid var(--cyan);border-radius:12px;cursor:crosshair;display:block}.pinw .dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#ff2e88aa;border:3px solid #fff;box-shadow:0 0 12px #ff2e88;pointer-events:none}
.cap{font:.8rem Arial,sans-serif;color:var(--sand);text-align:center;margin:6px 0 0}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.door,.dial,.shackle{transition-duration:.01s;transition-delay:0s}.shake,.gold,.now .d{animation:none}}
</style>
</head>
<body>
<main>
<h1>Grand Theft Quest</h1>
<p class="sub">Retracez l'histoire de GTA et ouvrez le coffre.</p>
<div id="top" class="hidden"><div class="bar"><span class="brand">Grand Theft Quest</span><span><span class="timer" id="timer"></span><button class="mute" id="mt" aria-label="Couper ou remettre la musique">♪ On</button></span></div><ol class="frise" id="fr" aria-label="Progression des missions"></ol></div>
<section class="card" id="card"></section>
</main>

<script>
/* ===== À PERSONNALISER ===== */
var VAULT_CODE="GTA6"; /* code du cadenas final (provisoire) */
var M=[
 {n:"Grand Theft Auto",s:"GTA",st:["énigme"]},
 {n:"Grand Theft Auto: London, 1969",s:"London 69",st:["énigme"]},
 {n:"Grand Theft Auto: London, 1961",s:"London 61",st:["énigme"]},
 {n:"Grand Theft Auto 2",s:"GTA 2",st:["énigme"]},
 {n:"Grand Theft Auto III",s:"GTA III",st:["énigme","énigme","blind test"]},
 {n:"Grand Theft Auto: Vice City",s:"Vice City",st:["blind test","énigme"]},
 {n:"Grand Theft Auto: San Andreas",s:"San Andreas",st:["blind test","énigme"]},
 {n:"Grand Theft Auto: Vice City Stories",s:"VC Stories",st:["blind test"]},
 {n:"Grand Theft Auto IV",s:"GTA IV",st:["blind test","énigme","énigme","énigme","énigme"]},
 {n:"Grand Theft Auto: Chinatown Wars",s:"Chinatown",st:["mini-jeu","mini-jeu"]},
 {n:"Grand Theft Auto V",s:"GTA V",st:["blind test","blind test","énigme"]},
 {n:"Grand Theft Auto VI",s:"GTA VI",st:["énigme finale"]}
];
/* Musique de fond de chaque mission : nom exact du fichier MP3 déposé à côté de index.html ("" = silence).
   Attention : GitHub distingue majuscules et minuscules. */
var MU=[
 "GTA 1 Theme Song.mp3",
 "GTA 1 Theme Song.mp3",
 "GTA 1 Theme Song.mp3",
 "Grand Theft Auto 2 - Main Theme.mp3",
 "Grand Theft Auto 3 \u2014 Theme Song.mp3",
 "Gta Vice City Theme.mp3",
 "Grand Theft Auto San Andreas (Official Theme Song).mp3",
 "Grand Theft Auto Vice City Stories Theme Song.mp3",
 "Grand Theft Auto IV Theme Song _[best quality]_.mp3",
 "",
 "GTA V - Welcome to Los Santos Soundtrack - IntroTheme song.mp3",
 "GTA 6 - Official Main Theme Music.mp3"
];
M.forEach(function(m,i){if(MU[i])m.mu=MU[i]});
/* Contenu provisoire de chaque épreuve : q = question, a = réponses acceptées, hint = indice */
function ph(t){return{t:t,q:"Contenu à définir. Pour tester, tapez « ok ».",a:["ok"],hint:"Indice à définir."}}
M.forEach(function(m){m.st=m.st.map(ph)});
/* Mission 1 : GTA (1997) */
M[0].st[0].q="Dans le tout premier GTA (1997), combien de villes peut-on explorer ?";
M[0].st[0].a=["3","trois"];
M[0].st[0].hint="Consultez la page du jeu.";
M[0].st[0].link="https://www.imdb.com/fr/title/tt0248048/?ref_=ext_shr_lnk";
M[0].st[0].show="3 (Liberty City, San Andreas, Vice City)";
M[0].st[0].info="Les trois villes du tout premier GTA sont <strong>Liberty City</strong> (inspirée de New York), <strong>San Andreas</strong> (inspirée de San Francisco) et <strong>Vice City</strong> (inspirée de Miami).";
/* Mission 2 : London 1969 */
M[1].st[0].show="Dan Houser";
M[1].st[0].info="Né à Londres, <strong>Dan Houser</strong> signe seul l'écriture de cette extension : c'est le début de sa carrière de scénariste chez Rockstar. Il y glisse l'ambiance du Swinging London, de l'argot cockney et des clins d'œil aux frères Kray, célèbres figures du crime londonien. Ce goût du détail de culture populaire deviendra la marque de fabrique de toute la saga.";
/* Mission 3 : London 1961 */
M[2].st[0].q="Pour qui travaille-t-on dans cette seconde extension du premier opus ?";
M[2].st[0].a=["haroldcartwright","cartwright"];
M[2].st[0].show="Harold Cartwright";
M[2].st[0].hint="Consultez la page du jeu.";
M[2].st[0].link="https://www.imdb.com/fr/title/tt3205178/?ref_=ls_t_3";
M[2].st[0].info="Londres, 1961 : <strong>Harold Cartwright</strong>, un caïd du crime qui prétend ne craindre personne, engage un jeune truand pour toutes sortes de sales boulots, que ce soit pour les redoutables jumeaux Crisp ou pour son propre gang. À la fin, il le félicite en personne dans un bar. Mais huit ans plus tard, dans London 1969, la roue tourne : ce sont les jumeaux Crisp qui ordonnent d'éliminer Harold. Cette extension, sortie gratuitement en juillet 1999, met en scène les mêmes personnages, en plus jeunes.";
/* Mission 4 : GTA 2 */
M[3].st[0].q="Dans GTA 2, quel est le nom du bâtiment où l'on doit aller pour sauvegarder sa partie ?";
M[3].st[0].a=["jesussave","jesussaves","jesus","eglisejesussaves","leglisejesussaves"];
M[3].st[0].show="Jesus Saves (l'église)";
M[3].st[0].hint="Regardez cette vidéo.";
M[3].st[0].lt="Ouvrir la vidéo";
M[3].st[0].link="https://www.youtube.com/watch?v=DRc8vJRUrRo&t=93s";
M[3].st[0].info="Dans GTA 2, il n'y a pas de bouton de sauvegarde : il faut trouver l'église <strong>Jesus Saves</strong> et y entrer, ce qui coûte de l'argent, donc mieux vaut avoir réussi quelques missions avant. Au fait, le héros s'appelle <strong>Claude Speed</strong> : ne le confondez pas avec Claude, le héros muet de GTA III.";
/* Mission 5 : GTA III (2 questions) */
M[4].st[0].q="Quel célèbre quartier, présent dans le 3ème opus, est le repaire de la mafia chinoise appelée la Triade ?";
M[4].st[0].a=["chinatown","quartierchinois","lequartierchinois"];
M[4].st[0].show="Chinatown";
M[4].st[0].info="<strong>Chinatown</strong>, sur l'île de Portland à Liberty City, est le territoire de la Triade. Son conflit avec la famille mafieuse Leone ouvre le premier acte de l'histoire de GTA III. Retenez ce quartier : la Triade reviendra au cœur de l'intrigue de Chinatown Wars, plus loin dans votre parcours.";
M[4].st[1].q="Dans GTA III, quel membre de la famille Leone ordonne à Claude d'éliminer les trois chefs de la Triade ?";
M[4].st[1].a=["tonicipriani","toni","cipriani"];
M[4].st[1].show="Toni Cipriani";
M[4].st[1].info="<strong>Toni Cipriani</strong>, capo de la famille Leone, donne la mission « Triads and Tribulations » depuis le restaurant de sa mère, à Saint Mark's, le quartier italien de Portland. Claude doit y emmener deux mafieux Leone à Chinatown pour éliminer trois chefs de la Triade. Toni deviendra plus tard le héros de Liberty City Stories, un préquel situé en 1998.";
M[4].st[2].q="Blind test : quel est le titre de ce morceau, que l'on entend à la radio dans GTA III ?";
M[4].st[2].a=["pushittothelimit","pushittolimit","pushtothelimit","scarfacepushittothelimit"];
M[4].st[2].show="Push It to the Limit (Paul Engemann)";
M[4].st[2].hint="Ce morceau est aussi présent dans le film Scarface.";
M[4].st[2].info="« Scarface (Push It to the Limit) », composé par Giorgio Moroder et chanté par <strong>Paul Engemann</strong>, vient de la bande originale du film Scarface (1983). Dans GTA III, on l'entend sur Flashback 95.6, la station des années 80. Vous le retrouverez aussi dans Vice City, dont l'ambiance doit beaucoup à ce film.";
/* Mission 6 : Vice City */
M[5].st[0].q="Blind test : quel groupe joue ce morceau, présent dans le jeu GTA Vice City ?";
M[5].st[0].a=["toto"];
M[5].st[0].show="Toto (Africa)";
M[5].st[0].hint="0 + 0 = ?";
M[5].st[0].info="C'est <strong>Toto</strong>, avec « Africa » (1982). Ce morceau passe sur la radio Emotion 98.3 dans Vice City, et on l'entend aussi pendant la cinématique qui suit l'achat de l'usine de glaces Cherry Popper. Un morceau devenu culte bien au-delà du jeu.";
M[5].st[1].q="Quelle est la célèbre voiture de cet opus, inspirée de la Ferrari Testarossa ?";
M[5].st[1].a=["cheetah","lacheetah","grotticheetah"];
M[5].st[1].show="La Cheetah";
M[5].st[1].info="C'est la <strong>Cheetah</strong>, inspirée de la <strong>Ferrari Testarossa</strong>, icône des années 80, la décennie de Vice City et de la série Miami Vice. Elle fait partie des voitures les plus rapides du jeu, et la police de Vice City en utilise même une version banalisée.";
/* Mission 7 : San Andreas */
M[6].st[0].q="Blind test : quel est le titre de ce morceau, que l'on entend dans GTA San Andreas ?";
M[6].st[0].a=["ahorsewithnoname","horsewithnoname","unchevalsansnom","chevalsansnom","caballosinnombre"];
M[6].st[0].show="A Horse with No Name (America)";
M[6].st[0].hint="Walter White chante aussi ce morceau dans Breaking Bad.";
M[6].st[0].vid="san-andreas.mp4";
M[6].st[0].gif="walter-white.gif";
M[6].st[0].alt2="Walter White chante le morceau dans Breaking Bad";
M[6].st[0].info="C'est <strong>« A Horse with No Name »</strong> du groupe America (1972), diffusé sur K-DST, la radio rock de San Andreas, idéale pour rouler dans le désert. Walter White le chante lui aussi dans Breaking Bad, dans la saison 3, épisode « Caballo sin Nombre », juste avant de se faire arrêter par la police.";
M[6].st[1].q="Quel code de triche de San Andreas donne d'un coup la vie, l'armure et de l'argent au joueur ?";
M[6].st[1].a=["hesoyam"];
M[6].st[1].show="HESOYAM";
M[6].st[1].hint="Il commence par H et finit par M.";
M[6].st[1].info="C'est <strong>HESOYAM</strong>, le code de triche le plus célèbre de la saga : il remplit la vie et l'armure du joueur et lui donne 250 000 $. Il est devenu un véritable symbole du jeu, repris par de nombreux fans.";
/* Mission 8 : Vice City Stories */
