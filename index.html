M[1].st[0].info="Né à Londres, <strong>Dan Houser</strong> signe seul l'écriture de cette extension : c'est le début de sa carrière de scénariste chez Rockstar. Il y glisse l'ambiance du Swinging London, de l'argot cockney et des clins d'œil aux frères Kray, célèbres figures du crime londonien. Ce goût du détail de culture populaire deviendra la marque de fabrique de toute la saga.";
/* Mission 3 : London 1961 */
M[2].st[0].q="Pour qui travaille-t-on dans cette seconde extension du premier opus ?";
M[2].st[0].a=["haroldcartwright","cartwright"];
M[2].st[0].show="Harold Cartwright";
M[2].st[0].hint="Consultez la page du jeu.";
M[2].st[0].link="https://www.imdb.com/fr/title/tt3205178/?ref_=ls_t_3";
M[2].st[0].info="Londres, 1961 : <strong>Harold Cartwright</strong>, un caïd du crime qui prétend ne craindre personne, engage un jeune truand pour toutes sortes de sales boulots, que ce soit pour les redoutables jumeaux Crisp ou pour son propre gang. À la fin, il le félicite en personne dans un bar. Mais huit ans plus tard, dans London 1969, la roue tourne : ce sont les jumeaux Crisp qui ordonnent d'éliminer Harold. Cette extension, sortie gratuitement en juillet 1999, met en scène les mêmes personnages, en plus jeunes.";
/* Mission 4 : GTA 2 */
M[3].st[0].q="Dans GTA 2, quel est le nom du bâtiment où l'on doit aller pour sauvegarder sa partie ?";
M[3].st[0].a=["jesussave","jesussaves","jesus","eglisejesussaves","leglisejesussaves"];
M[3].st[0].show="Jesus Saves (l'église)";

M[3].st[0].lt="Ouvrir la vidéo";

M[3].st[0].info="Dans GTA 2, il n'y a pas de bouton de sauvegarde : il faut trouver l'église <strong>Jesus Saves</strong> et y entrer, ce qui coûte de l'argent, donc mieux vaut avoir réussi quelques missions avant. Au fait, le héros s'appelle <strong>Claude Speed</strong> : ne le confondez pas avec Claude, le héros muet de GTA III.";
/* Mission 5 : GTA III (2 questions) */
M[4].st[0].q="Quel célèbre quartier, présent dans le 3ème opus, est le repaire de la mafia chinoise appelée la Triade ?";
M[4].st[0].a=["chinatown","quartierchinois","lequartierchinois"];
M[4].st[0].show="Chinatown";
M[4].st[0].info="<strong>Chinatown</strong>, sur l'île de Portland à Liberty City, est le territoire de la Triade. Son conflit avec la famille mafieuse Leone ouvre le premier acte de l'histoire de GTA III. Comme toute Liberty City, il s'inspire de New York : c'est la réplique du <strong>Chinatown de Manhattan</strong>. Retenez ce quartier : la Triade reviendra au cœur de l'intrigue de Chinatown Wars, plus loin dans votre parcours.";M[4].st[0].ipic="chinatown new york.jpg";
M[4].st[1].q="Dans GTA III, quel membre de la famille Leone ordonne à Claude d'éliminer les trois chefs de la Triade ?";
M[4].st[1].a=["tonicipriani","toni","cipriani"];
M[4].st[1].show="Toni Cipriani";
M[4].st[1].info="<strong>Toni Cipriani</strong>, capo de la famille Leone, donne la mission « Triads and Tribulations » depuis le restaurant de sa mère, à Saint Mark's, le quartier italien de Portland. Claude doit y emmener deux mafieux Leone à Chinatown pour éliminer trois chefs de la Triade. Toni deviendra plus tard le héros de Liberty City Stories, un préquel situé en 1998.";
M[4].st[2].q="Blind test : quel est le titre de ce morceau, que l'on entend à la radio dans GTA III ?";
M[4].st[2].a=["pushittothelimit","pushittolimit","pushtothelimit","scarfacepushittothelimit"];
M[4].st[2].show="Push It to the Limit (Paul Engemann)";
M[4].st[2].hint="Ce morceau est aussi présent dans le film Scarface.";
M[4].st[2].info="« Scarface (Push It to the Limit) », composé par Giorgio Moroder et chanté par <strong>Paul Engemann</strong>, vient de la bande originale du film Scarface (1983). Dans GTA III, on l'entend sur Flashback 95.6, la station des années 80. Vous le retrouverez aussi dans Vice City, dont l'ambiance doit beaucoup à ce film.";

M[5].st[0].ipic="Pochette Toto Africa.jpg";M[5].st[0].info="C'est <strong>Toto</strong>, avec « Africa » (1982). Ce morceau passe sur la radio Emotion 98.3 dans Vice City, et on l'entend aussi pendant la cinématique qui suit l'achat de l'usine de glaces Cherry Popper. Un morceau devenu culte bien au-delà du jeu.";
M[5].st[1].q="Quelle est la célèbre voiture de cet opus, inspirée de la Ferrari Testarossa ?";

M[5].st[1].show="La Cheetah";
M[5].st[1].info="C'est la <strong>Cheetah</strong>, inspirée de la <strong>Ferrari Testarossa</strong>, icône des années 80, la décennie de Vice City et de la série Miami Vice. Elle fait partie des voitures les plus rapides du jeu, et la police de Vice City en utilise même une version banalisée.";

M[6].st[0].info="C'est <strong>« A Horse with No Name »</strong> du groupe America (1972), diffusé sur K-DST, la radio rock de San Andreas, idéale pour rouler dans le désert. Walter White le chante lui aussi dans Breaking Bad, dans la saison 3, épisode « Caballo sin Nombre », juste avant de se faire arrêter par la police.";
M[6].st[1].q="Quel code de triche de San Andreas donne d'un coup la vie, l'armure et de l'argent au joueur ?";

M[6].st[1].hint="Il commence par H et finit par M.";
M[6].st[1].info="C'est <strong>HESOYAM</strong>, le code de triche le plus célèbre de la saga : il remplit la vie et l'armure du joueur et lui donne 250 000 $. Il est devenu un véritable symbole du jeu, repris par de nombreux fans.";
/* Mission 8 : Vice City Stories */
M[7].st[0].q="Blind test : quel artiste chante ce morceau, présent dans le jeu GTA Vice City Stories ?";
M[7].st[0].a=["philcollins","collins"];
M[7].st[0].show="Phil Collins (In the Air Tonight)";
M[7].st[0].hint="Son tube « In the Air Tonight » a été rendu célèbre par une publicité culte de 2007 pour une marque de chocolat : un gorille y joue le fameux solo de batterie.";
M[7].st[0].yt="NHtEyDrD4oA";
M[7].st[0].info="C'est <strong>Phil Collins</strong>, avec « In the Air Tonight » (1981). Dans Vice City Stories (2006), il apparaît en personne : il est le premier artiste réel à figurer tel quel dans un GTA. Le héros doit le protéger avant son concert, où il joue justement ce morceau, que l'on entend aussi sur la radio Emotion 98.3. En 2007, le morceau a connu une seconde jeunesse grâce à une publicité devenue culte pour la marque de chocolat Cadbury : un gorille y joue le célèbre solo de batterie. À revoir juste en dessous !";

/* Mission 11 : GTA V, « Braquage de l'Union Depository » (4 préparations + le braquage final) */
M[10].obj="Réussir les 4 missions de préparation pour terminer par le braquage final du coffre de Lamar.";
M[10].st[0].kind="crew";M[10].st[0].noPass=1;M[10].st[0].lbl="Mission de préparation 1";
M[10].st[0].q="Recruter l'équipe du braquage.";
M[10].st[0].dl=[{w:"Franklin",t:"{N}, j'ai un coup pour toi. Un vieux pote d'enfance m'a fait un sale coup : il s'est barré avec mon butin.",a:"voix-m11-01.mp3"},{w:"Franklin",t:"Si t'es bon, je partagerai la somme avec toi. Lester supervise, et toi et moi, on se charge du reste.",a:"voix-m11-02.mp3"},{w:"Lester",t:"Il nous faut une équipe :\n• un hacker, pour trouver le mot de passe du téléphone de Lamar et le numéro de son coffre ;\n• un chauffeur, qui récupérera le fourgon et les tenues de convoyeurs de fonds ;\n• et un tireur, qui repérera le fourgon et les tenues, et nous aidera si ça dérape (zéro risque).\nEt la liste en bas du tableau, tu n'y touches pas. J'ai déjà travaillé avec eux : compte pas sur eux.",a:"voix-m11-03.mp3"},{w:"Franklin",t:"Je veux la meilleure équipe possible. Mais je ne lâche pas plus de 25 % du butin à l'équipe. Pas un de plus.",a:"voix-m11-04.mp3"}];
M[10].st[0].show="Chris Feltz, Mike Welsh et Taliana Martinez (25 %)";
M[10].st[0].hints=[{t:"Il faut la meilleure compétence totale possible, pas forcément le meilleur à chaque poste."},{t:"Les plus forts coûtent trop cher ensemble : sacrifiez un peu de talent à chaque poste."},{t:"La bonne équipe coûte exactement 25 %."}];
M[10].st[0].info="Dans GTA V, avant chaque braquage, on choisit ses complices : plus ils sont doués, plus leur part du butin est élevée. Un complice bon marché peut faire capoter le coup… mais il progresse s'il survit au braquage.";
M[10].st[1].kind="hack";M[10].st[1].lbl="Mission de préparation 2";M[10].st[1].mu="audio-m11-braquage.mp3";
M[10].st[1].q="Pirater le téléphone de Lamar pour trouver le numéro de son coffre.";
M[10].st[1].pw="CHOPISMINEBITCH!";
M[10].st[1].dl=[{w:"Lester",t:"Merde, Chris a renversé sa canette de Junk Energy Drink sur son PC…",a:"voix-m11-05.mp3"},{w:"Lester",t:"Junk Energy donne des ailes, mais là, c'est son PC qui s'est envolé. Chris ne pourra pas nous aider. Fait chier !…",a:"voix-m11-06.mp3"},{w:"Franklin",t:"Lester, tu penses pouvoir t'en occuper ? Lamar note tout sur son téléphone : on devrait pouvoir y trouver le numéro de son coffre.",a:"voix-m11-07.mp3"},{w:"Lester",t:"Mon programme fait défiler les caractères de son code. Vert, c'est le bon : appuie sur espace pour le verrouiller. Rouge, tu attends.",a:"voix-m11-08.mp3"}];

M[10].st[1].gif="gif-m11.gif";
M[10].st[1].show="CHOPISMINEBITCH! · coffre n° 0451";
M[10].st[1].hints=[{t:"Ne verrouillez que quand le caractère s'affiche en vert."},{t:"Le code parle du chien que Lamar et Franklin se disputent."},{t:"Il est en anglais et se termine par un point d'exclamation."}];
M[10].st[1].info="Chop, le rottweiler, appartient d'abord à Lamar, mais c'est Franklin qui finit par s'en occuper. Une application compagnon de GTA V permettait même de le dresser depuis son téléphone.";
M[10].st[2].kind="spot";M[10].st[2].lbl="Mission de préparation 3";M[10].st[2].mu="audio-m11-braquage.mp3";
